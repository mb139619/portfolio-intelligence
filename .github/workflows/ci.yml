name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject (StrEnum, tomllib).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ examples/

      # The suite is deliberately offline: every test builds synthetic data or
      # monkeypatches the fetch, so nothing here touches Yahoo, FRED, the French
      # library or Binance, and no local Parquet store is required.
      - name: Test
        run: pytest -q
